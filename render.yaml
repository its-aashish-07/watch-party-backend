services:
  - type: web
    name: syncroom-watch-party-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: syncroom_watch_party
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ROOM_TTL_MINUTES
        value: 360
      - key: MAX_PARTICIPANTS_PER_ROOM
        value: 50
